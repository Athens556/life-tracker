# Deploys the site to Firebase Hosting (live) on every push to master.
# Needs these secrets. The VITE_ ones are ENVIRONMENT secrets in the GitHub environment `env1`
# (Settings > Environments > env1); the service account is a repository secret:
#   FIREBASE_SERVICE_ACCOUNT_LIFE_TRACKER_BC437  (created by `firebase init hosting:github`)
#   VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID
# The VITE_ values are the same ones as in the local .env file.

name: Deploy to Firebase Hosting on push to master
on:
  push:
    branches:
      - master
concurrency:
  group: deploy-live
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: env1   # the VITE_ secrets live in this GitHub environment
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the Firebase config secrets are set
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v"; exit 1; fi
          done
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFE_TRACKER_BC437 }}
          channelId: live
          projectId: life-tracker-bc437
